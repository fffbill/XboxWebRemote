[package]
name = "xboxwebremote"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
form_urlencoded = "1.2.2"
p256 = { version = "0.14.0", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tao = "0.37.2"
time = { version = "0.3.55", features = ["parsing", "local-offset"] }
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }
rand_core = "0.10.1"
webrtc = "0.17.2"
rtp = "0.17.2"
rtcp = "0.17.2"
webrtc-media = "0.17.2"
env_logger = "0.11.11"
rustls = { version = "0.23.46", features = ["ring"] }
cpal = "0.18.2"
raw-window-handle = "0.6.2"
objc2-quartz-core = "0.3.2"
objc2-core-foundation = "0.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-game-controller = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
cc = "1.11.2"
